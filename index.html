<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tree Task Board</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loadingScreen" class="loading-screen">
    <div class="loading-spinner"></div>
    <div class="loading-text">Connecting...</div>
  </div>

  <header class="topbar">
    <div id="topbarProjectView" class="project-switcher">
      <button id="projectMenuBtn" class="icon-btn hamburger-btn" title="Switch project"></button>
      <span id="projectName" class="project-name" contenteditable="true" spellcheck="false" data-role="rename"></span>
    </div>
    <div id="topbarHomeView" class="project-switcher" hidden>
      <span class="project-name">All Projects</span>
    </div>
    <div class="topbar-actions">
      <span id="syncStatus" class="sync-status">Connecting...</span>
      <button id="timelineBtn" class="icon-btn timeline-btn" title="Timeline (version history)"></button>
      <button id="newTreeBtn" class="btn btn-primary">+ New Board</button>
      <input type="color" id="colorPickerInput" hidden>
    </div>
  </header>

  <div id="projectMenu" class="project-menu" hidden>
    <button id="projectMenuHomeBtn" class="btn btn-ghost project-menu-home">All Projects</button>
    <div id="projectMenuList" class="project-menu-list"></div>
    <button id="addProjectBtn" class="btn btn-ghost project-menu-add">+ New Project</button>
  </div>

  <section id="projectHome" class="project-home" hidden>
    <h1 class="project-home-title">Your Projects</h1>
    <div id="projectHomeList" class="project-home-list"></div>
    <button id="projectHomeNewBtn" class="btn btn-primary">+ New Project</button>
  </section>

  <section id="projectProgress" class="project-progress">
    <div class="project-progress-bar"><div id="projectProgressFill" class="project-progress-fill"></div></div>
    <span id="projectProgressLabel" class="project-progress-label"></span>
  </section>

  <section id="dashboard" class="dashboard">
    <button id="priorityBtn" class="btn btn-ghost dash-btn"></button>
    <button id="unblockedBtn" class="btn btn-ghost dash-btn"></button>
    <button id="lockedBtn" class="btn btn-ghost dash-btn"></button>
  </section>

  <main id="board" class="board">
    <!-- tree cards get rendered here -->
  </main>

  <div id="emptyState" class="empty-state" hidden>
    <p>No boards yet.</p>
    <button id="emptyNewTreeBtn" class="btn btn-primary">Create your first board</button>
  </div>

  <div id="detailsOverlay" class="details-overlay" hidden>
    <div class="details-panel" role="dialog" aria-modal="true">
      <div class="details-panel-top">
        <div id="detailsBreadcrumb" class="details-breadcrumb"></div>
        <button id="detailsClose" class="icon-btn" title="Close"></button>
      </div>
      <div class="details-title-row">
        <input id="detailsTitle" class="details-title-input" type="text" placeholder="Item name" spellcheck="false">
        <button id="detailsPriorityBtn" class="icon-btn priority-star" title="Mark as priority"></button>
      </div>
      <div id="detailsMeta" class="details-meta"></div>
      <div id="detailsDeps" class="details-deps"></div>
      <label class="details-label">Tags</label>
      <div id="detailsTags" class="details-tags"></div>
      <label class="details-label" for="detailsNotes">Notes</label>
      <textarea id="detailsNotes" class="details-notes" rows="6" placeholder="Add more details..."></textarea>
      <label class="details-label">Images</label>
      <div id="detailsImages" class="details-images"></div>
      <input type="file" id="imageInput" accept="image/*" hidden>
      <div class="details-image-actions">
        <button id="addImageBtn" class="btn btn-ghost">+ Add image</button>
        <span class="details-image-hint">or paste an image (Ctrl+V)</span>
      </div>
      <div id="imageUploadError" class="details-image-error" hidden></div>
      <div id="detailsChildren" class="details-children"></div>
      <div class="details-actions">
        <button id="detailsAddChild" class="btn btn-ghost">Add sub-item</button>
        <button id="detailsDelete" class="btn btn-ghost danger">Delete</button>
      </div>
    </div>
  </div>

  <div id="timelineOverlay" class="details-overlay" hidden>
    <div class="details-panel timeline-panel" role="dialog" aria-modal="true">
      <div class="details-panel-top">
        <h2 class="timeline-title">Timeline</h2>
        <button id="timelineClose" class="icon-btn" title="Close"></button>
      </div>
      <div id="timelineList" class="timeline-list"></div>
    </div>
  </div>

  <div id="dashFullOverlay" class="details-overlay" hidden>
    <div class="details-panel dash-full-panel" role="dialog" aria-modal="true">
      <div class="details-panel-top">
        <h2 id="dashFullTitle" class="timeline-title">Priority</h2>
        <button id="dashFullClose" class="icon-btn" title="Close"></button>
      </div>
      <select id="dashFullTagFilter" class="dash-full-tag-filter" hidden></select>
      <div id="dashFullList" class="dash-list dash-full-list"></div>
    </div>
  </div>

  <div id="lightboxOverlay" class="details-overlay lightbox-overlay" hidden>
    <button id="lightboxClose" class="icon-btn lightbox-close" title="Close"></button>
    <button id="lightboxPrev" class="lightbox-nav lightbox-prev" title="Previous"></button>
    <img id="lightboxImg" class="lightbox-img" alt="">
    <button id="lightboxNext" class="lightbox-nav lightbox-next" title="Next"></button>
    <div id="lightboxCounter" class="lightbox-counter"></div>
  </div>

  <div id="tagPickerOverlay" class="confirm-overlay" hidden>
    <div class="confirm-panel tag-picker-panel">
      <p id="tagPickerTitle" class="confirm-message"></p>
      <div id="tagPickerList" class="tag-picker-list"></div>
      <div class="tag-picker-new-row">
        <button id="tagPickerNewBtn" class="tag-new-btn">+ New tag</button>
        <input type="text" id="tagPickerInput" class="tag-input" placeholder="tag name" hidden>
      </div>
      <div class="confirm-actions">
        <button id="tagPickerCancelBtn" class="btn btn-ghost">Cancel</button>
      </div>
    </div>
  </div>

  <div id="confirmOverlay" class="confirm-overlay" hidden>
    <div class="confirm-panel" role="alertdialog" aria-modal="true">
      <p id="confirmMessage" class="confirm-message"></p>
      <div class="confirm-actions">
        <button id="confirmCancelBtn" class="btn btn-ghost">Cancel</button>
        <button id="confirmOkBtn" class="btn btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
